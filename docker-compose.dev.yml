services:
  front-end:
    build:
      context: ./front-app/
      dockerfile: ../docker/front-end/Dockerfile
      target: development
    ports:
      - "5173:5173"

  back-end: # Laravel
    build:
      context: ./back-app/
      dockerfile: ../docker/back-end/Dockerfile
    ports:
      - "443:443"
      - "80:80"
      - "8080:8080"
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=tarot_db
      - DB_USERNAME=tarot_user
      - DB_PASSWORD=tarot_password

  # PostgreSQL
  postgres:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: tarot_db
      POSTGRES_USER: tarot_user
      POSTGRES_PASSWORD: tarot_password

    ports:
      - "5432:5432"

    volumes:
      - ./postgres_data:/var/lib/postgresql/

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarot_user -d tarot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: