services:
  front-end:
    build:
      context: ./front-app/
      dockerfile: ../docker/front-end/Dockerfile
      target: production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.front-end.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.services.front-end.loadbalancer.server.port=80"

  # back-end
  back-end: # Laravel
    build:
      context: ./back-app/
      dockerfile: ../docker/back-end/Dockerfile
    ports:
      - "443:443"
      - "80:80"
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=tarot_db
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

  # PostgreSQL
  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Traefik

  # PG admin

  # Grafana

volumes:
  postgres_data: